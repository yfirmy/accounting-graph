# Copier dans conf/splitwise_rules.ini et renseigner les paramètres avant activation.
[Splitwise]
enabled = false
# Clé personnelle de l'API dans une variable d'environnement, jamais ici.
token_env = SPLITWISE_API_KEY
# Groupe réel à renseigner. Partage égal entre ses membres ; tu paies la totalité.
group_id = 0

[boulangerie_dimanche]
# Adapter à la longueur du compte ; X masque exactement un chiffre.
account = XXXXXXXXXXX
label_regex = (?i)boulangerie
# Date de comptabilisation OFX (DTPOSTED), pas une date de valeur distincte.
# 1=lundi, ..., 7=dimanche. Les jours absents ne correspondent pas à cette règle.
# Pour utiliser la date d'achat JJ/MM en fin de libellé à la place de DTPOSTED :
# purchase_date_taken = end_of_label
# Sans option (ou posting_date) : date de comptabilisation DTPOSTED de l'OFX.
# Le délai maximal achat/comptabilisation est fixé globalement à 6 jours.
# À activer de la même façon sur toutes les règles d'un même commerçant.
weekdays = 7
min_amount = 4
max_amount = 14
action = auto
outside_amount = confirm
# Libellé envoyé à Splitwise, indépendant du libellé bancaire. Aucun numéro de compte.
description = Boulangerie
# Optionnel : identifiant d'une sous-catégorie renvoyée par get_categories.
# category_id = 15
# Optionnel : ne traiter que les dépenses à partir de cette date.
# start_date = 2026-10-18

[boulangerie_lundi]
account = XXXXXXXXXXX
label_regex = (?i)boulangerie
weekdays = 1
action = skip
